name: CI

on:
  push:
  pull_request:

# Una rama nueva cancela la ejecución anterior de esa misma rama, pero no mezcla
# resultados entre pushes distintos.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      # Ollama y Gemini se sustituyen por mocks/MockTransport: la CI no necesita
      # secretos, modelos descargados ni conexiones a servicios externos.
      - name: Ejecutar pruebas
        run: python -m pytest -q

  frontend:
    name: Frontend · test y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar producción
        run: npm run build
